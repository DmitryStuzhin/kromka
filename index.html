function upcomingFixtures(predicate){
  const today=moscowDateKey(), now=Date.now();
  return matches.filter(m=>{
    if(!predicate(m)||m.status!=='live'&&m.status!=='soon')return false;
    if(m.status==='live')return true;
    if(m.dateKey!==today)return m.dateKey>today;
    const time=fixtureKickoff(m);
    return !time||Date.parse(`${m.dateKey}T${time}:00+03:00`)>now;

  return `<div class="matchday-page club-hub"><div class="matchday-heading"><h1>Мой клуб</h1><button class="club-switch" id="searchClubBtn">Сменить клуб</button></div>

    <div class="club-hub-tabs" aria-label="Разделы клуба">${[['обзор','Обзор'],['календарь','Матчи'],['состав','Состав']].map(([id,label])=>`<button type="button" data-club-section="${id}" aria-pressed="${clubSection===id}">${label}</button>`).join('')}</div>
    ${clubSection==='календарь'?schedule:clubSection==='состав'?section('Игроки',roster||empty('Состав недоступен в демо-режиме.')):overview}</div>`;
}
function clubPage(){return clubProfilePage()}
function render(){const view={today:window.home||home,matches:window.matchesPage||matchesPage,favorites:window.favoritesPage||favoritesPage,table:window.tablePage||tablePage,club:window.clubPage||clubPage}[tab]||home;screen.innerHTML=view();screen.classList.remove('matchday-detail');document.querySelectorAll('.nav-item').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));bind()}
function bind(){bindMatchday();document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.go;render();window.scrollTo(0,0)}));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{window.closeMatchdayDetail?.();tab=b.dataset.tab;if(tab==='club'&&!favorites.has(selectedClub))selectedClub=trackedClubIds()[0]||selectedClub;render();window.scrollTo(0,0)});document.querySelectorAll('[data-week-shift]').forEach(b=>b.addEventListener('click',()=>shiftCalendarWeek(b.dataset.weekShift)));document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{chooseCalendarDate(b.dataset.day);render();screen.querySelector('[data-day="'+selectedDay+'"]')?.focus({preventScroll:true});}));document.querySelectorAll('[data-match]').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('[data-fav-match]'))return;openMatch(b.dataset.match)}));document.querySelectorAll('[data-fav-match]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=String(b.dataset.favMatch);if(favoriteMatches.has(id))favoriteMatches.delete(id);else favoriteMatches.add(id);persistSet('temp-rpl:favorite-matches',favoriteMatches);showToast(favoriteMatches.has(id)?'Матч добавлен в избранное':'Матч удалён из избранного');render()}));document.querySelectorAll('[data-match-scope]').forEach(b=>b.addEventListener('click',()=>{matchScope=b.dataset.matchScope;render()}));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filterClub=b.dataset.filter;render()}));document.querySelectorAll('[data-club-row]').forEach(b=>b.addEventListener('click',()=>{selectedClub=b.dataset.clubRow;tab='club';clubSection='обзор';render();window.scrollTo(0,0)}));document.querySelectorAll('[data-club-section]').forEach(b=>b.addEventListener('click',()=>{clubSection=b.dataset.clubSection;render()}));document.querySelectorAll('[data-favorite-club]').forEach(b=>b.addEventListener('click',()=>{let id=b.dataset.favoriteClub;if(favorites.has(id))favorites.delete(id);else favorites.add(id);persistSet('temp-rpl:favorite-clubs',favorites);showToast(favorites.has(id)?'Клуб добавлен в избранное':'Клуб удалён из избранного');render()}));document.querySelectorAll('[data-open-club]').forEach(b=>b.addEventListener('click',()=>{selectedClub=b.dataset.openClub;tab='club';clubSection='обзор';render();window.scrollTo(0,0)}));document.querySelector('[data-open-favorites-matches]')?.addEventListener('click',()=>{matchScope='favorites';filterClub='all';matchdayRange=false;tab='matches';const date=followedUpcoming()[0]?.dateKey||moscowDateKey();setCalendarWeek(startOfWeek(date),date);render();window.scrollTo(0,0)});document.getElementById('compareLeft')?.addEventListener('change',e=>{const next=e.target.value;if(next===compareRight)compareRight=compareLeft;compareLeft=next;render()});document.getElementById('compareRight')?.addEventListener('change',e=>{const next=e.target.value;if(next===compareLeft)compareLeft=compareRight;compareRight=next;render()});document.getElementById('searchClubBtn')?.addEventListener('click',openSearch)}
function openMatch(id){modalMatch=matches.find(m=>m.id===id);let m=modalMatch,h=clubs[m.home],a=clubs[m.away];sheet.innerHTML=`<div class="sheet-handle"></div><div class="sheet-head"><div><h2>Матч-центр</h2><p>${m.date} · ${m.venue} · ДЕМО-ДАННЫЕ</p></div><button class="close-button" data-close>×</button></div><div class="match-card" style="cursor:default"><div class="match-top"><span class="match-round">ТУР ${m.round} · РПЛ</span>${statusText(m)}</div><div class="match-row"><div class="team-side">${clubBadge(m.home)}<span class="team-name">${h.short}</span></div><div class="score ${m.status==='soon'?'upcoming':''}">${m.score}</div><div class="team-side away"><span class="team-name">${a.short}</span>${clubBadge(m.away)}</div></div><div class="match-foot"><span class="venue">${m.venue}</span><span>СЧЁТ: ПРИМЕР</span></div></div><div class="section-heading"><h2>События</h2><span class="micro">${m.events.length?m.events.length+' ЭПИЗОДА':'НЕТ СОБЫТИЙ'}</span></div>${m.events.length?m.events.map(e=>`<div class="event-row"><span class="event-time">${e[0]}</span><span class="event-main">${e[1]}</span><span class="event-side">${e[2]}</span></div>`).join(''):`<div class="empty-note">Лента событий появится после подключения лицензированного live-провайдера.</div>`}<div class="section-heading"><h2>Цифры матча</h2><span class="micro">${m.status==='soon'?'ОЖИДАНИЕ':'МАКЕТ'}</span></div><div class="stats-block">${m.stats.map(s=>`<div class="stat-row"><span>${s[1]}</span><div><div class="stat-label">${s[0]}</div><div class="stat-track"><div class="stat-fill" style="width:${s[1]+s[2]?(s[1]/(s[1]+s[2])*100):50}%"></div></div></div><span>${s[2]}</span></div>`).join('')}</div><div class="empty-note">Это интерактивный макет, не трансляция. В релизе события должны поступать от лицензированного поставщика.</div>`;openOverlay()}
function openSearch(){sheet.innerHTML=`<div class="sheet-handle"></div><div class="sheet-head"><div><h2>Клубы РПЛ</h2><p>Выберите команду для раздела «Мой клуб»</p></div><button class="close-button" data-close>×</button></div><input class="search-input" id="clubSearch" placeholder="Название или город" autocomplete="off"><div class="search-results" id="searchResults">${Object.entries(clubs).map(([id,c])=>`<button class="search-result" data-pick-club="${id}">${clubBadge(id)}<span>${c.short}<small style="display:block;color:#85877e;font:400 8px var(--mono);margin-top:3px">${c.city}</small></span></button>`).join('')}</div>`;openOverlay();bindSearch()}
function bindSearch(){document.querySelectorAll('[data-pick-club]').forEach(b=>b.addEventListener('click',()=>{selectedClub=b.dataset.pickClub;tab='club';clubSection='обзор';closeOverlay();render();window.scrollTo(0,0)}));document.getElementById('clubSearch')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.search-result').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none')})}
function openOverlay(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';sheet.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeOverlay))}
function closeOverlay(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow=''}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay()});document.getElementById('searchBtn').addEventListener('click',openSearch);document.getElementById('refreshBtn').addEventListener('click',()=>window.refreshGoalData?.());function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
render();
</script>
</body>
</html>

services:
  - type: web
    name: kromka
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GOAL_RPL_SEASON
        value: "2026"
      - key: RPL_FLASHSCORE_ENABLED
        value: "true"
      - key: RPL_FLASHSCORE_AUTOSTART
        value: "true"
      - key: RPL_FLASHSCORE_PROXY_URL
        value: http://127.0.0.1:8765
      - key: GOAL_API_KEY
        sync: false
      - key: API_FOOTBALL_API_KEY
        sync: false

apply plugin: 'com.android.application'

def pushProject = providers.gradleProperty('rustoreProjectId').orElse(providers.environmentVariable('RUSTORE_PROJECT_ID')).getOrElse('')
if (pushProject && !(pushProject ==~ /[A-Za-z0-9_-]{3,160}/)) throw new GradleException('Invalid RuStore project ID')
def releaseCode = providers.environmentVariable('KROMKA_VERSION_CODE').getOrElse('1')
def releaseName = providers.environmentVariable('KROMKA_VERSION_NAME').getOrElse('0.2.0')
if (!(releaseCode ==~ /[1-9][0-9]{0,8}/) || !(releaseName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) throw new GradleException('Invalid Android version')
def signingPath = providers.environmentVariable('KROMKA_KEYSTORE_PATH').getOrElse('')
android {
    namespace = "ru.tokenapp.kromka"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.tokenapp.kromka"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(releaseCode)
        versionName releaseName
        buildConfigField 'String', 'RUSTORE_PROJECT_ID', '"' + pushProject + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments additionalTestOutputDir: "/sdcard/Android/media/ru.tokenapp.kromka/smoke-output"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if(signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('KROMKA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KROMKA_KEY_ALIAS')
                keyPassword System.getenv('KROMKA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if(graph.allTasks.any { it.project == project && it.name in ['assembleRelease', 'bundleRelease'] } && !signingPath)
        throw new GradleException('Release signing credentials are required; refusing an unsigned release')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'ru.rustore.sdk:pushclient:7.6.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
